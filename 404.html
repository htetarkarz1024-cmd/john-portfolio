  }

    display: inline-block;
    background: #d4af37;
    color: #0d3b2e;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    line-height: 1;
    padding: 0.95rem 1.5rem;
    border-radius: 999px;
